plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'de.schaefchens.scriptura'
version = '0.0.0'

android {
  namespace "de.schaefchens.scriptura"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
    consumerProguardFiles "consumer-rules.pro"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The core's Kotlin bindings load it through JNA.
  implementation "net.java.dev.jna:jna:5.17.0@aar"
  // Screen readers find the headings and verses the pages draw as virtual views.
  implementation "androidx.customview:customview:1.1.0"
  // Recordings play with Media3's player: it seeks to the sample, and keeps the voice's pitch at every rate.
  implementation "androidx.media3:media3-exoplayer:1.11.1"
}
