[package]
name = "scriptura-wasm"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Scriptura for the web, through wasm-bindgen"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scriptura = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# At the version of the wasm-bindgen CLI that bindings/web/build.sh runs.
wasm-bindgen = "=0.2.129"
