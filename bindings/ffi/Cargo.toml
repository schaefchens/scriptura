[package]
name = "scriptura-ffi"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Scriptura for Swift and Kotlin, through UniFFI"
publish = false

[lib]
name = "scriptura_ffi"
# A dynamic library, so it sits next to other Rust libraries in an app, each with its own runtime.
crate-type = ["lib", "cdylib"]

[dependencies]
scriptura = { path = "../.." }
thiserror = "2"
uniffi = "0.31"
